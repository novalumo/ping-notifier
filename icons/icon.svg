<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- アプリアイコンの元データ。編集後は icons/generate.sh で PNG / ICO を再生成する -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3b8f"/>
      <stop offset="1" stop-color="#0a1230"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34c759" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34c759" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#7ef09a"/>
      <stop offset="1" stop-color="#28a745"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- 本体（macOS のアイコングリッドに合わせ 1024 中 824 の角丸正方形） -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <g clip-path="url(#body)">
    <circle cx="512" cy="512" r="320" fill="url(#glow)"/>

    <!-- ping の波紋 -->
    <g fill="none" stroke="#34c759" stroke-width="36">
      <circle cx="512" cy="512" r="150" stroke-opacity="0.95"/>
      <circle cx="512" cy="512" r="240" stroke-opacity="0.6"/>
      <circle cx="512" cy="512" r="330" stroke-opacity="0.3"/>
    </g>

    <!-- 発信源 -->
    <circle cx="512" cy="512" r="80" fill="url(#dot)"/>

    <!-- 届かなかったパケット -->
    <circle cx="682" cy="342" r="80" fill="#0f1b45"/>
    <circle cx="682" cy="342" r="60" fill="#ff3b30"/>
  </g>

  <!-- 上端のハイライトで立体感を出す -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
</svg>
