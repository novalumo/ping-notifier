name: Release

# v* タグの push で macOS / Windows 向けにビルドし、GitHub Release を作成する。
# 手動実行（workflow_dispatch）ではビルドと成果物のアップロードだけを行い、Release は作らない。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Check tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::タグ $GITHUB_REF_NAME が Cargo.toml の version ($version) と一致しません"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS (Apple Silicon)
    needs: version
    runs-on: macos-latest
    env:
      ARCHIVE: PingNotifier-${{ needs.version.outputs.version }}-macos-arm64.zip
      APP: target/aarch64-apple-darwin/release/bundle/osx/Ping Notifier.app
      # 署名・公証用のシークレット。未登録なら ad-hoc 署名で配布する
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.9.0 --locked

      # Intel Mac は今後廃止されるため、Apple Silicon 向けだけをビルドする。
      # cargo bundle は --locked を渡せないので、先に cargo build で Cargo.lock どおりにビルドしておく
      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Bundle .app
        run: |
          cargo bundle --release --target aarch64-apple-darwin
          lipo -info "$APP/Contents/MacOS/ping-notifier"

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -A -t cert
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          # 既存のキーチェーンを残したまま検索対象に加える
          existing=()
          while IFS= read -r k; do existing+=("$k"); done \
            < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"$/\1/')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Sign
        run: |
          if [[ -n "$MACOS_CERTIFICATE_P12" ]]; then
            # 公証にはハードンドランタイムとタイムスタンプ付きの署名が必要
            codesign --force --options runtime --timestamp \
              --sign "Developer ID Application" "$APP"
          else
            echo "::warning::署名用のシークレットが未登録のため ad-hoc 署名で配布します"
            codesign --force --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize
        if: env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_API_KEY_P8 != ''
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m
          rm "$key"
          # 公証の結果を .app に添付し、オフラインでも Gatekeeper が検証できるようにする
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"

      - name: Archive
        run: ditto -c -k --keepParent "$APP" "$ARCHIVE"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    env:
      ARCHIVE: PingNotifier-${{ needs.version.outputs.version }}-windows-x64.zip
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path target/release/ping-notifier.exe -DestinationPath $env:ARCHIVE

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # アプリの自動アップデートは、このファイルでダウンロードしたファイルを検証する
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum PingNotifier-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag

  # novalumo/homebrew-tap の Cask を新しいバージョンに更新する。
  # tap への書き込みには GitHub App のトークンを使う。シークレットが未登録なら警告を出してスキップする
  homebrew:
    name: Update Homebrew cask
    if: github.ref_type == 'tag'
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: PingNotifier-${{ needs.version.outputs.version }}-macos-arm64.zip
      CASK: tap/Casks/ping-notifier.rb
      HOMEBREW_TAP_APP_CLIENT_ID: ${{ secrets.HOMEBREW_TAP_APP_CLIENT_ID }}
      HOMEBREW_TAP_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
    steps:
      - name: Check secrets
        if: env.HOMEBREW_TAP_APP_CLIENT_ID == '' || env.HOMEBREW_TAP_APP_PRIVATE_KEY == ''
        run: echo "::warning::tap 用のシークレットが未登録のため、Cask を更新しません。novalumo/homebrew-tap の Casks/ping-notifier.rb を手動で更新してください"

      - id: token
        if: env.HOMEBREW_TAP_APP_CLIENT_ID != '' && env.HOMEBREW_TAP_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ env.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: novalumo
          repositories: homebrew-tap
          permission-contents: write

      - if: steps.token.outcome == 'success'
        uses: actions/checkout@v7
        with:
          repository: novalumo/homebrew-tap
          token: ${{ steps.token.outputs.token }}
          path: tap

      # Release に添付したものと同じファイル（ビルドジョブの成果物）からハッシュを取る
      - if: steps.token.outcome == 'success'
        uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      - name: Update cask
        if: steps.token.outcome == 'success'
        run: |
          sha256=$(sha256sum "dist/$ARCHIVE" | cut -d' ' -f1)
          # url も書き換えるので、配布ファイル名を変えたときはここも合わせること
          url='https://github.com/siraken/ping-notifier/releases/download/v#{version}/PingNotifier-#{version}-macos-arm64.zip'
          sed -i -E \
            -e "s|^  version \".*\"$|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$sha256\"|" \
            -e "s|^  url \".*\"$|  url \"$url\"|" \
            "$CASK"
          # 書き換え漏れ（Cask の書式が変わった場合など）を検出する
          grep -qxF "  version \"$VERSION\"" "$CASK"
          grep -qxF "  sha256 \"$sha256\"" "$CASK"
          grep -qxF "  url \"$url\"" "$CASK"
          git -C tap diff

      - name: Push
        if: steps.token.outcome == 'success'
        working-directory: tap
        run: |
          if git diff --quiet; then
            echo "Cask is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ping-notifier $VERSION"
          git push
